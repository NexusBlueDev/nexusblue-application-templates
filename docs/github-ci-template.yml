# GitHub Actions CI/CD Template — NexusBlue v6.0
#
# THREE-ENVIRONMENT PIPELINE: sandbox/* → dev → main (production)
#
# USAGE: Copy to .github/workflows/ci.yml in each project.
# Replace the three ENV values below. Set VERCEL_TOKEN + VERCEL_TEAM_ID as repo secrets.
#
# GitHub → [repo] → Settings → Secrets and variables → Actions:
#   VERCEL_TOKEN     = same token as in .env.local
#   VERCEL_TEAM_ID   = team_hWt6xTS7kGfR781smAzdmvzV  (constant for all projects)
#
# Get REPO_ID:
#   VERCEL_TOKEN=$(grep '^VERCEL_TOKEN=' .env.local | cut -d= -f2-)
#   curl -s "https://api.vercel.com/v9/projects/YOUR-PROJECT?teamId=team_hWt6xTS7kGfR781smAzdmvzV" \
#     -H "Authorization: Bearer $VERCEL_TOKEN" | \
#     python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('link',{}).get('repoId'))"
#
# ENVIRONMENTS:
#   sandbox/*  → CI advisory (test failures don't block deploy), Vercel auto-preview URL
#   dev        → CI required (tests must pass), deploys to [project].nexusblue.ai
#   main       → CI required (tests must pass), deploys to production, creates release tag

name: CI

on:
  push:
    branches: [main, dev, 'sandbox/**']
  pull_request:
    branches: [main, dev]

env:
  PROJECT_NAME: REPLACE_PROJECT_NAME    # e.g., pw-app
  REPO_NAME: REPLACE_REPO_NAME          # e.g., pw-app  (GitHub repo name)
  REPO_ID: REPLACE_REPO_ID              # numeric GitHub repo ID (see above)

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Lint + Typecheck + Test
  # Required for dev/main. Advisory for sandbox/*.
  # ─────────────────────────────────────────────
  quality:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Security audit
        run: npm audit --audit-level=high || true

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test
        # Sandbox branches: test failures are advisory (don't block deploy)
        # The continue-on-error is controlled per-environment below
        continue-on-error: ${{ startsWith(github.ref, 'refs/heads/sandbox/') }}
        env:
          # Mock values — tests use vi.mock() for Supabase, never hit a real DB
          NEXT_PUBLIC_SUPABASE_URL: https://mock.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock_anon_key
          SUPABASE_SERVICE_ROLE_KEY: mock_service_key
          ANTHROPIC_API_KEY: mock_key
          # Add any other NEXT_PUBLIC_ vars your build requires:
          # NEXT_PUBLIC_SITE_URL: https://example.com

  # ─────────────────────────────────────────────
  # Job 2: Deploy Sandbox Preview
  # Runs on push to sandbox/* branches.
  # Vercel auto-generates a unique preview URL for each branch.
  # Quality is advisory — deploys even if tests fail.
  # ─────────────────────────────────────────────
  deploy-sandbox:
    name: Deploy → Sandbox Preview
    needs: quality
    if: always() && startsWith(github.ref, 'refs/heads/sandbox/') && github.event_name == 'push' && needs.quality.result != 'cancelled'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Vercel sandbox deploy
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Deploying sandbox branch: $BRANCH"
          RESPONSE=$(curl -s -X POST \
            "https://api.vercel.com/v13/deployments?teamId=${{ secrets.VERCEL_TEAM_ID }}" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"name\": \"$PROJECT_NAME\",
              \"gitSource\": {
                \"type\": \"github\",
                \"org\": \"NexusBlueDev\",
                \"repo\": \"$REPO_NAME\",
                \"repoId\": $REPO_ID,
                \"ref\": \"$BRANCH\"
              }
            }")
          DEPLOY_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id','ERROR'))")
          DEPLOY_URL=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('url', 'pending'))")
          echo "Sandbox deploy triggered: $DEPLOY_ID"
          echo "Preview URL: https://$DEPLOY_URL"
          if [ "$DEPLOY_ID" = "ERROR" ]; then
            echo "Deploy failed to start. Response:"
            echo "$RESPONSE"
            exit 1
          fi

      - name: Report quality status
        if: needs.quality.result == 'failure'
        run: |
          echo "::warning::Quality checks failed on sandbox branch — deploy proceeded (advisory mode)"
          echo "Tests or lint failed. Review before promoting to dev."

  # ─────────────────────────────────────────────
  # Job 3: Tag Production Release
  # Vercel GitHub integration auto-deploys dev and main.
  # CI only tags releases — no duplicate API deploys.
  # ─────────────────────────────────────────────
  tag-release:
    name: Tag Release
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Tag release
        run: |
          TAG="release-$(date -u +%Y%m%d-%H%M%S)"
          git tag "$TAG"
          git push origin "$TAG"

  # ─────────────────────────────────────────────
  # Job 5: Docs Freshness Check (Safety Net)
  # Runs on push to main. Advisory — warns if docs are stale.
  # Primary enforcement is the local Claude Code hook.
  # ─────────────────────────────────────────────
  docs-freshness:
    name: Docs Freshness
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check documentation freshness
        run: |
          WARNINGS=0

          # Check 1: HANDOFF.md exists
          if [ ! -f "HANDOFF.md" ]; then
            echo "::warning::HANDOFF.md is missing — this project has no state document"
            WARNINGS=$((WARNINGS + 1))
          else
            # Check 2: HANDOFF.md has been updated within the last 14 days
            LAST_MODIFIED=$(git log -1 --format="%at" -- HANDOFF.md 2>/dev/null)
            NOW=$(date +%s)
            if [ -n "$LAST_MODIFIED" ]; then
              AGE_DAYS=$(( (NOW - LAST_MODIFIED) / 86400 ))
              if [ "$AGE_DAYS" -gt 14 ]; then
                echo "::warning::HANDOFF.md last updated $AGE_DAYS days ago — may be stale"
                WARNINGS=$((WARNINGS + 1))
              else
                echo "✓ HANDOFF.md updated $AGE_DAYS days ago"
              fi
            fi
          fi

          # Check 3: TODO.md exists (if HANDOFF.md exists)
          if [ -f "HANDOFF.md" ] && [ ! -f "TODO.md" ]; then
            echo "::warning::TODO.md is missing — human action items may be undocumented"
            WARNINGS=$((WARNINGS + 1))
          elif [ -f "TODO.md" ]; then
            echo "✓ TODO.md exists"
          fi

          # Check 4: ARCHITECTURE.md exists (if project has src/)
          if [ -d "src" ] && [ ! -f "ARCHITECTURE.md" ]; then
            echo "::warning::ARCHITECTURE.md is missing — architecture decisions are undocumented"
            WARNINGS=$((WARNINGS + 1))
          elif [ -f "ARCHITECTURE.md" ]; then
            echo "✓ ARCHITECTURE.md exists"
          fi

          # Summary
          if [ "$WARNINGS" -gt 0 ]; then
            echo ""
            echo "⚠ $WARNINGS documentation warning(s) found"
            echo "Run the docs enforcement agent to fix these gaps"
          else
            echo ""
            echo "✓ All documentation checks passed"
          fi

