# CI Healer — Self-Healing CI Agent (Reusable Template)
#
# Copy to: .github/workflows/ci-healer.yml
# Replace: REPLACE_CI_WORKFLOW_NAME with your CI workflow name (e.g., "CI")
#
# Requires repo secrets:
#   ANTHROPIC_API_KEY — Claude Code Action authentication
#   NEXT_PUBLIC_SUPABASE_URL — (optional) for agent run logging
#   SUPABASE_SERVICE_ROLE_KEY — (optional) for agent run logging
#
# Behavior:
#   sandbox/* branches → autonomous (pushes fix directly)
#   dev branch → supervised (creates PR with fix)
#   main branch → NOT triggered (production failures are human-only)

name: CI Healer

on:
  workflow_run:
    workflows: ["REPLACE_CI_WORKFLOW_NAME"]
    types: [completed]

env:
  SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  heal:
    name: Diagnose & Fix CI Failure
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push' &&
      (
        github.event.workflow_run.head_branch == 'dev' ||
        startsWith(github.event.workflow_run.head_branch, 'sandbox/')
      )

    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Detect environment
        id: env
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          if [[ "$BRANCH" == sandbox/* ]]; then
            echo "environment=sandbox" >> "$GITHUB_OUTPUT"
            echo "autonomy=autonomous" >> "$GITHUB_OUTPUT"
          else
            echo "environment=dev" >> "$GITHUB_OUTPUT"
            echo "autonomy=supervised" >> "$GITHUB_OUTPUT"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"

      - name: Log agent run start
        id: log_start
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_KEY != ''
        run: |
          RUN_ID=$(curl -s -X POST "$SUPABASE_URL/rest/v1/dev_agent_runs" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{
              \"agent_type\": \"dev-ci-healer\",
              \"trigger_type\": \"ci_failure\",
              \"trigger_ref\": \"${{ steps.env.outputs.run_id }}\",
              \"environment\": \"${{ steps.env.outputs.environment }}\",
              \"autonomy_level\": \"${{ steps.env.outputs.autonomy }}\",
              \"status\": \"running\",
              \"input_summary\": \"CI failure on ${{ steps.env.outputs.branch }}\",
              \"model_used\": \"claude-sonnet-4-6\"
            }" | python3 -c "import sys,json; data=json.load(sys.stdin); print(data[0]['id'] if isinstance(data, list) else data.get('id',''))" 2>/dev/null)
          echo "agent_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download CI failure logs
        uses: actions/github-script@v7
        id: logs
        with:
          script: |
            const runId = ${{ github.event.workflow_run.id }};
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const failedJob = jobs.data.jobs.find(j => j.conclusion === 'failure');
            if (!failedJob) {
              core.setOutput('failure_log', 'No failed job found in workflow run.');
              return;
            }
            const logs = await github.rest.actions.downloadJobLogsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              job_id: failedJob.id,
            });
            const logText = typeof logs.data === 'string' ? logs.data : String(logs.data);
            const truncated = logText.length > 4000 ? '...[truncated]\n' + logText.slice(-4000) : logText;
            core.setOutput('failure_log', truncated);
            core.setOutput('failed_job_name', failedJob.name);

      - name: Claude Code — diagnose and fix
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are the CI Healer agent for a NexusBlue project.

            A CI job failed on branch `${{ steps.env.outputs.branch }}` (environment: ${{ steps.env.outputs.environment }}).

            Failed job: ${{ steps.logs.outputs.failed_job_name }}

            CI failure log:
            ```
            ${{ steps.logs.outputs.failure_log }}
            ```

            Your task:
            1. Analyze the failure log to identify the root cause
            2. Fix the issue in the codebase
            3. Keep changes minimal — fix only what caused the CI failure
            4. Do NOT modify test expectations to make tests pass — fix the actual code
            5. Do NOT add new features or refactor unrelated code
            6. If the failure is a flaky test or infrastructure issue, report it but do not change code

            After fixing, provide a one-line summary of what was wrong and what you fixed.
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 15
          use_commit_signing: true

      - name: Push fix (sandbox — autonomous)
        if: steps.env.outputs.environment == 'sandbox'
        run: |
          git config user.name "claude-ci-healer[bot]"
          git config user.email "ci-healer@nexusblue.dev"
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to push — failure may be infrastructure-related"
          else
            git add -A
            git commit -m "fix(ci-healer): auto-fix CI failure on ${{ steps.env.outputs.branch }}

            Triggered by workflow run #${{ steps.env.outputs.run_id }}

            Co-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>"
            git push origin ${{ steps.env.outputs.branch }}
          fi

      - name: Create fix PR (dev — supervised)
        if: steps.env.outputs.environment == 'dev'
        run: |
          git config user.name "claude-ci-healer[bot]"
          git config user.email "ci-healer@nexusblue.dev"
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit — failure may be infrastructure-related"
            exit 0
          fi
          FIX_BRANCH="ci-fix/${{ steps.env.outputs.run_id }}"
          git checkout -b "$FIX_BRANCH"
          git add -A
          git commit -m "fix(ci-healer): fix CI failure on dev

          Triggered by workflow run #${{ steps.env.outputs.run_id }}

          Co-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>"
          git push origin "$FIX_BRANCH"

          gh pr create \
            --base dev \
            --head "$FIX_BRANCH" \
            --title "fix(ci-healer): auto-fix CI failure" \
            --body "## CI Healer Auto-Fix

          **Triggered by:** Workflow run [#${{ steps.env.outputs.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.env.outputs.run_id }})
          **Branch:** \`${{ steps.env.outputs.branch }}\`
          **Failed job:** \`${{ steps.logs.outputs.failed_job_name }}\`

          This PR was automatically generated by the CI Healer agent. Please review before merging.

          ---
          🤖 Generated by dev-ci-healer agent"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Log agent run completion
        if: always() && steps.log_start.outputs.agent_run_id != ''
        run: |
          STATUS="completed"
          if [ "${{ job.status }}" != "success" ]; then
            STATUS="failed"
          fi
          HAS_CHANGES="false"
          if ! git diff --quiet 2>/dev/null || ! git diff --cached --quiet 2>/dev/null; then
            HAS_CHANGES="true"
          fi

          curl -s -X PATCH "$SUPABASE_URL/rest/v1/dev_agent_runs?id=eq.${{ steps.log_start.outputs.agent_run_id }}" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"status\": \"$STATUS\",
              \"completed_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",
              \"output_summary\": \"CI healer $STATUS on ${{ steps.env.outputs.branch }}. Changes made: $HAS_CHANGES\",
              \"changes_made\": {\"has_changes\": $HAS_CHANGES, \"environment\": \"${{ steps.env.outputs.environment }}\"}
            }"
